# Shiroi Visuals - deferred PBR shaderpack for Iris (OpenGL)
# Target: Iris 1.11.7 (MC 26.3), compute shaders + custom images + SSBO required.

iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES SSBO
# asked only so that IRIS_FEATURE_TESSELLATION_SHADERS tells Iris apart from engines without the extra stages
# (lib/common.glsl SHADOW_SINGLE_PASS); the pack has no tessellation program
iris.features.optional = TESSELLATION_SHADERS

clouds = fancy
oldLighting = false
separateAo = false
underwaterOverlay = false
vignette = false
sun = true
moon = true
shadowTerrain = true
shadowTranslucent = false
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
# the End flash (Iris 1.11; the directive is endFlashShadows, ShaderProperties.supportsEndFlash): shadowLightPosition
# and the shadow map follow the flash, which is the only direct light of the End (lib/daylight.glsl). Iris then draws the
# flash 5 to 60 degrees above the horizon in any direction (MixinEndFlash; vanilla -10 to 60). Older Iris has no flash
endFlashShadows = true
frustum.culling = true
shadow.culling = true
rain.depth = false
particles.ordering = AFTER

# ------------------------------------------------------------------ buffers
size.buffer.colortex8 = 0.5 0.5
size.buffer.colortex9 = 0.25 0.25
size.buffer.colortex10 = 0.125 0.125
size.buffer.colortex11 = 0.0625 0.0625
size.buffer.colortex12 = 0.03125 0.03125
size.buffer.colortex13 = 0.015625 0.015625
size.buffer.colortex14 = 256 128
size.buffer.colortex15 = 0.125 0.125

# colortex1 after deferred: the water texture layer (WATER_TEXTURE) or the translucents in front of the water; colortex4 the water surface
# colortex4 blended with its alpha: water writes alpha 1, the other translucents alpha 0 and leave the water under them
blend.gbuffers_water.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# colortex2.b: transmittance of the translucents in front of the nearest water (gbuffers_translucent outCover)
blend.gbuffers_water.colortex2 = ONE ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_hand_water.colortex2 = ONE ONE_MINUS_SRC_ALPHA ZERO ONE
#ifdef WATER_TEXTURE
blend.gbuffers_water.colortex1 = off
blend.gbuffers_hand_water.colortex1 = off
#else
# premultiplied colour of the translucents in front of the nearest water (water writes alpha 1 and clears it)
blend.gbuffers_water.colortex1 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex1 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
#endif

# camera in water: 0 on entering -> 1 after ~30 s (the underwater fog opens from 25 % of its distance, ~60 % at 5 s)
variable.float.eyeSubmerged = if(isEyeInWater == 1, 1.0, 0.0)
# Iris smooth(): half-life = 0.1 x time -> 55 gives 47 % after 5 s and 98 % after 30 s, 0.5 resets on leaving
uniform.float.waterEyeAdapt = smooth(eyeSubmerged, 55.0, 0.5)
# sky objects accumulate (sun, moon and stars are additive); colortex5.a stays 0 for the particle coverage
blend.gbuffers_skybasic = ONE ONE ZERO ONE
blend.gbuffers_skytextured = ONE ONE ZERO ONE
# glass dims the sun behind it (colortex5.rgb), without touching the particle coverage (colortex5.a)
blend.gbuffers_water.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
blend.gbuffers_hand_water.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ZERO ONE
# particles / weather: view depth in colortex7.a (rgb kept), coverage in colortex5.a (and the sun behind dimmed)
blend.gbuffers_textured.colortex7 = ZERO ONE ONE ZERO
blend.gbuffers_textured_lit.colortex7 = ZERO ONE ONE ZERO
blend.gbuffers_particles.colortex7 = ZERO ONE ONE ZERO
blend.gbuffers_particles_translucent.colortex7 = ZERO ONE ONE ZERO
blend.gbuffers_weather.colortex7 = ZERO ONE ONE ZERO
blend.gbuffers_textured.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# glint adds to colortex7.rgb only: .a holds the depth of entities drawn after deferred
blend.gbuffers_armor_glint = ONE ONE ZERO ONE
blend.gbuffers_damagedblock = DST_COLOR SRC_COLOR ZERO ONE
blend.gbuffers_clouds = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# clouds overwrite the sun / moon / stars (colortex5, added in composite), so a cloud hides them completely
blend.gbuffers_clouds.colortex5 = off
# entities / block entities / hand: forward colour in colortex0 (blended), G-buffer + flag written without blending
blend.gbuffers_entities.colortex1 = off
blend.gbuffers_entities.colortex2 = off
blend.gbuffers_entities.colortex3 = off
blend.gbuffers_entities_translucent.colortex1 = off
blend.gbuffers_entities_translucent.colortex2 = off
blend.gbuffers_entities_translucent.colortex3 = off
blend.gbuffers_block.colortex1 = off
blend.gbuffers_block.colortex2 = off
blend.gbuffers_block.colortex3 = off
blend.gbuffers_hand.colortex1 = off
blend.gbuffers_hand.colortex2 = off
blend.gbuffers_hand.colortex3 = off
# view depth of forward surfaces drawn after the depthtex1 copy (MC 26 translucent features: the player)
blend.gbuffers_entities.colortex7 = off
blend.gbuffers_entities_translucent.colortex7 = off
blend.gbuffers_block.colortex7 = off
blend.gbuffers_hand.colortex7 = off
# direct light of entities (caustics), written over the sky objects buffer where the entity is
blend.gbuffers_entities.colortex5 = off
blend.gbuffers_entities_translucent.colortex5 = off
blend.gbuffers_block.colortex5 = off
blend.gbuffers_hand.colortex5 = off
blend.gbuffers_spidereyes.colortex3 = off
blend.gbuffers_beaconbeam.colortex3 = off
blend.gbuffers_basic.colortex3 = off
blend.gbuffers_line.colortex3 = off
# glow channel (colortex2 after deferred): eyes / beams overwrite it, lit particles add to it
blend.gbuffers_spidereyes.colortex2 = off
blend.gbuffers_beaconbeam.colortex2 = off
blend.gbuffers_textured.colortex2 = ONE ONE ONE ONE
blend.gbuffers_textured_lit.colortex2 = ONE ONE ONE ONE
blend.gbuffers_particles.colortex2 = ONE ONE ONE ONE
# opaque particles (gbuffers_particles, drawn before deferred in MC 26): forward flag written as it is
blend.gbuffers_particles.colortex3 = off
blend.gbuffers_particles_translucent.colortex2 = ONE ONE ONE ONE

# pale garden look (fog, light, white balance): smoothed biome weight (BIOME_* constants come from the biome registry)
# the biome exists from 1.21.4 on; before it the constant would not resolve
#if MC_VERSION >= 12104
variable.float.paleGardenTarget = if(biome == BIOME_PALE_GARDEN, 1.0, 0.0)
#else
variable.float.paleGardenTarget = 0.0
#endif
uniform.float.paleGardenWeight = smooth(paleGardenTarget, 40.0, 40.0)
# where the precipitation at the player is snow (Iris biome_precipitation: 0 none, 1 rain, 2 snow): white fog while
# it snows (lib/daylight.glsl); smoothed so a biome border does not switch it at once
variable.float.snowTarget = if(biome_precipitation == 2, 1.0, 0.0)
uniform.float.snowWeight = smooth(snowTarget, 10.0, 10.0)
# Biome look. All smoothed so a biome border blends over a few seconds.
# colour temperature of the grading (final.glsl, BIOME_GRADING): cold 10000 K (snowy biomes, frozen waters), ice spikes
# 11000 K, coolish 9000 K (taigas, windswept hills, mountains, cold oceans), warmish 4800 K (jungles, savannas, warm
# oceans, stony peaks, lush caves; sulfur caves below), desert 4400 K, badlands 4800 K, mangrove 5125 K, else 6500 K.
# The pale garden (9000 K) keeps its own weight (paleGardenWeight).
variable.float.biomeKelvinTarget = if(biome == BIOME_SNOWY_PLAINS || biome == BIOME_SNOWY_TAIGA || biome == BIOME_SNOWY_BEACH || biome == BIOME_FROZEN_RIVER || biome == BIOME_FROZEN_OCEAN || biome == BIOME_DEEP_FROZEN_OCEAN || biome == BIOME_FROZEN_PEAKS, 10000.0, biome == BIOME_ICE_SPIKES, 11000.0, biome == BIOME_TAIGA || biome == BIOME_OLD_GROWTH_PINE_TAIGA || biome == BIOME_OLD_GROWTH_SPRUCE_TAIGA || biome == BIOME_SNOWY_SLOPES || biome == BIOME_GROVE || biome == BIOME_JAGGED_PEAKS || biome == BIOME_WINDSWEPT_HILLS || biome == BIOME_WINDSWEPT_GRAVELLY_HILLS || biome == BIOME_WINDSWEPT_FOREST || biome == BIOME_COLD_OCEAN || biome == BIOME_DEEP_COLD_OCEAN, 9000.0, biome == BIOME_JUNGLE || biome == BIOME_SPARSE_JUNGLE || biome == BIOME_BAMBOO_JUNGLE || biome == BIOME_SAVANNA || biome == BIOME_SAVANNA_PLATEAU || biome == BIOME_WINDSWEPT_SAVANNA || biome == BIOME_WARM_OCEAN || biome == BIOME_LUKEWARM_OCEAN || biome == BIOME_DEEP_LUKEWARM_OCEAN || biome == BIOME_STONY_PEAKS || biome == BIOME_LUSH_CAVES, 4800.0, biome == BIOME_DESERT, 4400.0, biome == BIOME_BADLANDS || biome == BIOME_ERODED_BADLANDS || biome == BIOME_WOODED_BADLANDS, 4800.0, biome == BIOME_MANGROVE_SWAMP, 5125.0, 6500.0)
uniform.float.biomeKelvin = smooth(biomeKelvinTarget, 20.0, 20.0)
# volumetric air of the biome (lib/froxel.glsl): density (no fog in deserts, badlands, snowy plains, frozen waters,
# flower forests and sunflower plains), scattering, absorption and anisotropy (humid jungles and mangroves, the swamp's
# brown absorption, the mushroom fields' green one, thin air over ice spikes, the dark forest's forward lobe)
variable.float.biomeFogDensityTarget = if(biome == BIOME_DESERT || biome == BIOME_BADLANDS || biome == BIOME_ERODED_BADLANDS || biome == BIOME_WOODED_BADLANDS || biome == BIOME_SNOWY_PLAINS || biome == BIOME_FROZEN_OCEAN || biome == BIOME_DEEP_FROZEN_OCEAN || biome == BIOME_FROZEN_RIVER || biome == BIOME_FLOWER_FOREST || biome == BIOME_SUNFLOWER_PLAINS, 0.0, 0.05)
uniform.float.biomeFogDensity = smooth(biomeFogDensityTarget, 10.0, 10.0)
variable.float.biomeFogScatterTarget = if(biome == BIOME_JUNGLE || biome == BIOME_BAMBOO_JUNGLE || biome == BIOME_LUSH_CAVES || biome == BIOME_MANGROVE_SWAMP || biome == BIOME_SWAMP, 0.06, biome == BIOME_MUSHROOM_FIELDS, 0.01, biome == BIOME_ICE_SPIKES, 0.02, 0.04)
uniform.float.biomeFogScatter = smooth(biomeFogScatterTarget, 10.0, 10.0)
variable.float.biomeFogAbsRTarget = if(biome == BIOME_SWAMP, 0.255, biome == BIOME_MUSHROOM_FIELDS, 0.042, 0.0)
variable.float.biomeFogAbsGTarget = if(biome == BIOME_SWAMP, 0.130, biome == BIOME_MUSHROOM_FIELDS, 0.137, 0.0)
variable.float.biomeFogAbsBTarget = if(biome == BIOME_SWAMP, 0.189, biome == BIOME_MUSHROOM_FIELDS, 0.012, 0.0)
uniform.float.biomeFogAbsR = smooth(biomeFogAbsRTarget, 10.0, 10.0)
uniform.float.biomeFogAbsG = smooth(biomeFogAbsGTarget, 10.0, 10.0)
uniform.float.biomeFogAbsB = smooth(biomeFogAbsBTarget, 10.0, 10.0)
variable.float.biomeFogGTarget = if(biome == BIOME_JUNGLE || biome == BIOME_BAMBOO_JUNGLE || biome == BIOME_LUSH_CAVES || biome == BIOME_MANGROVE_SWAMP || biome == BIOME_SWAMP, 0.4, biome == BIOME_MUSHROOM_FIELDS || biome == BIOME_ICE_SPIKES, 0.3, biome == BIOME_DARK_FOREST, 0.75, 0.6)
uniform.float.biomeFogG = smooth(biomeFogGTarget, 10.0, 10.0)
# 1 when the custom uniforms above loaded (an engine that cannot evaluate them reads 0: the shaders keep the defaults)
uniform.float.biomeLookReady = 1.0
# precipitation at the player (rain or snow): the weather fog only closes in where it actually rains or snows
variable.float.precipitationTarget = if(biome_precipitation > 0, 1.0, 0.0)
uniform.float.precipitationWeight = smooth(precipitationTarget, 10.0, 10.0)
# sulfur caves (26.x): the dense, warm-graded cave air. Its own uniform, so that a version without the
# biome only loses this one
#if MC_VERSION >= 260100
variable.float.sulfurCavesTarget = if(biome == BIOME_SULFUR_CAVES, 1.0, 0.0)
#else
variable.float.sulfurCavesTarget = 0.0
#endif
uniform.float.sulfurCavesWeight = smooth(sulfurCavesTarget, 10.0, 10.0)
# Nether atmospheres per biome (sky = fog colour, Rayleigh strength): nether wastes 51 8 8, crimson forest 51 3 3,
# warped forest 30 15 30, soul sand valley 27 71 69, basalt deltas 104 95 112
variable.float.netherSkyRTarget = if(biome == BIOME_WARPED_FOREST, 30.0, biome == BIOME_SOUL_SAND_VALLEY, 27.0, biome == BIOME_BASALT_DELTAS, 104.0, 51.0)
variable.float.netherSkyGTarget = if(biome == BIOME_WARPED_FOREST, 15.0, biome == BIOME_SOUL_SAND_VALLEY, 71.0, biome == BIOME_BASALT_DELTAS, 95.0, biome == BIOME_CRIMSON_FOREST, 3.0, 8.0)
variable.float.netherSkyBTarget = if(biome == BIOME_WARPED_FOREST, 30.0, biome == BIOME_SOUL_SAND_VALLEY, 69.0, biome == BIOME_BASALT_DELTAS, 112.0, biome == BIOME_CRIMSON_FOREST, 3.0, 8.0)
variable.float.netherRayleighTarget = if(biome == BIOME_WARPED_FOREST, 0.25, biome == BIOME_BASALT_DELTAS, 0.1, 0.15)
uniform.float.netherSkyR = smooth(netherSkyRTarget, 10.0, 10.0)
uniform.float.netherSkyG = smooth(netherSkyGTarget, 10.0, 10.0)
uniform.float.netherSkyB = smooth(netherSkyBTarget, 10.0, 10.0)
uniform.float.netherRayleigh = smooth(netherRayleighTarget, 10.0, 10.0)

# split-sum BRDF table, caustic animation; the cloud layout is the game's own texture (its pattern differs between
# 1.21.1 and 1.21.11, and resource packs can replace it), see lib/clouds.glsl
customTexture.brdfLut = textures/brdf_lut.png
customTexture.causticsTex = textures/caustics.png
customTexture.cloudTex = minecraft:textures/environment/clouds.png
# relief of the still and flowing water: normal map + material map (metal, emissive, roughness, subsurface), our own
# synthesis, generated for this pack
customTexture.waterNormalStill = textures/water_still_normal.png
customTexture.waterNormalFlow = textures/water_flow_normal.png
customTexture.waterMersStill = textures/water_still_material.png
customTexture.waterMersFlow = textures/water_flow_material.png

# ------------------------------------------------------------------ SSBO: exposure histogram + bilateral grid
bufferObject.0 = 296000
# cloud tracking state (lib/clouds.glsl)
bufferObject.1 = 2048
# shadow grid state (lib/shadowmap.glsl): light-space shift and the shadow cell of the last frame
bufferObject.2 = 32
# player motion state (lib/motion.glsl): the eye's camera-relative position of the last frame
bufferObject.3 = 16
# entity vertex tracking (lib/entitymotion.glsl): two tables of 32768 slots of 16 bytes
bufferObject.4 = 1048576
# coloured block light (lib/lightcolor.glsl): splat grid 64 x 32 x 64 cells x 4 uint, spread images (program/lightcolor_spread.glsl)
bufferObject.5 = 2097152
image.lcA = lcASampler rgba rgba16f half_float false false 64 32 64
image.lcB = lcBSampler rgba rgba16f half_float false false 64 32 64
image.lcC = lcCSampler rgba rgba16f half_float false false 64 32 64
image.lcD = lcDSampler rgba rgba16f half_float false false 64 32 64
program.prepare2.enabled = COLORED_LIGHT
program.prepare3.enabled = COLORED_LIGHT
program.prepare4.enabled = COLORED_LIGHT
program.world1/prepare2.enabled = COLORED_LIGHT
program.world1/prepare3.enabled = COLORED_LIGHT
program.world1/prepare4.enabled = COLORED_LIGHT
program.world-1/prepare2.enabled = COLORED_LIGHT
program.world-1/prepare3.enabled = COLORED_LIGHT
program.world-1/prepare4.enabled = COLORED_LIGHT
# entity screen motion for the TAA in colortex4 (lib/entitymotion.glsl), written as it is (alpha 0: no water there)
blend.gbuffers_entities.colortex4 = off
blend.gbuffers_entities_translucent.colortex4 = off
# sun / moon disc mask accumulated over frames, ping-pong (program/celestial_history.glsl)
image.celestialA = celestialASampler red r16f half_float false true 1.0 1.0
# TAA per-pixel state: phase hold run, frames still (lib/taa.glsl), ping-pong
image.taaFlickA = taaFlickASampler rg rg16f half_float false true 1.0 1.0
image.taaFlickB = taaFlickBSampler rg rg16f half_float false true 1.0 1.0
image.celestialB = celestialBSampler red r16f half_float false true 1.0 1.0

# ------------------------------------------------------------------ froxel volume (grid per VOLUME_QUALITY, lib/look.glsl FROXEL_GRID)
#if VOLUME_QUALITY == 3
image.volShadowA = volShadowASampler red r16f half_float false false 240 136 96
image.volShadowB = volShadowBSampler red r16f half_float false false 240 136 96
image.volMedia = volMediaSampler rgba rgba16f half_float false false 240 136 96
image.volScatter = volScatterSampler rgba rgba16f half_float false false 240 136 96
image.volColumn = volColumnSampler rgba rgba16f half_float false false 240 136
#elif VOLUME_QUALITY == 2
image.volShadowA = volShadowASampler red r16f half_float false false 240 136 48
image.volShadowB = volShadowBSampler red r16f half_float false false 240 136 48
image.volMedia = volMediaSampler rgba rgba16f half_float false false 240 136 48
image.volScatter = volScatterSampler rgba rgba16f half_float false false 240 136 48
image.volColumn = volColumnSampler rgba rgba16f half_float false false 240 136
#elif VOLUME_QUALITY == 1
image.volShadowA = volShadowASampler red r16f half_float false false 120 72 64
image.volShadowB = volShadowBSampler red r16f half_float false false 120 72 64
image.volMedia = volMediaSampler rgba rgba16f half_float false false 120 72 64
image.volScatter = volScatterSampler rgba rgba16f half_float false false 120 72 64
image.volColumn = volColumnSampler rgba rgba16f half_float false false 120 72
#else
image.volShadowA = volShadowASampler red r16f half_float false false 32 24 32
image.volShadowB = volShadowBSampler red r16f half_float false false 32 24 32
image.volMedia = volMediaSampler rgba rgba16f half_float false false 32 24 32
image.volScatter = volScatterSampler rgba rgba16f half_float false false 32 24 32
image.volColumn = volColumnSampler rgba rgba16f half_float false false 32 24
#endif
image.gridImg = gridImgSampler rgba rgba16f half_float false false 64 36 16

# ------------------------------------------------------------------ program toggles
program.world-1/composite.enabled = VOLUMETRIC_FOG
program.world-1/composite1.enabled = VOLUMETRIC_FOG
program.world-1/composite2.enabled = VOLUMETRIC_FOG
program.world1/composite.enabled = VOLUMETRIC_FOG
program.world1/composite1.enabled = VOLUMETRIC_FOG
program.world1/composite2.enabled = VOLUMETRIC_FOG
program.world-1/shadow.enabled = false
program.composite.enabled = VOLUMETRIC_FOG
program.composite1.enabled = VOLUMETRIC_FOG
program.composite2.enabled = VOLUMETRIC_FOG
# LE_DOWN (colortex15) is only read by LE_APPLY inside #ifdef LOCAL_EXPOSURE: skip it when local exposure is off
program.composite10.enabled = LOCAL_EXPOSURE
program.world-1/composite10.enabled = LOCAL_EXPOSURE
program.world1/composite10.enabled = LOCAL_EXPOSURE

# ------------------------------------------------------------------ options screen
# ------------------------------------------------------------------ quality presets (Iris profiles)
# MEDIUM = the defaults of lib/settings.glsl (the intended look) and is therefore the preset shown on a fresh install.
# Every profile sets the same options, so switching presets never leaves a mix; options not listed here (tonemap,
# colours, intensities...) keep the user's own values. 
# (local exposure stays on in every preset: without it the image is ~30/255 darker on average, measured)
profile.ULTRA_LOW = SHADOW_QUALITY=0 shadowMapResolution=2048 !CLOUD_SHADOWS VOLUMETRIC_FOG VOLUME_QUALITY=0 !SSR SSR_STEPS=32 IBL LOCAL_EXPOSURE !MICRO_DETAIL WATER_CAUSTICS BLOOM
profile.LOW = SHADOW_QUALITY=1 shadowMapResolution=2048 CLOUD_SHADOWS VOLUMETRIC_FOG VOLUME_QUALITY=1 SSR SSR_STEPS=64 IBL LOCAL_EXPOSURE !MICRO_DETAIL WATER_CAUSTICS BLOOM
profile.MEDIUM = SHADOW_QUALITY=3 shadowMapResolution=4096 CLOUD_SHADOWS VOLUMETRIC_FOG VOLUME_QUALITY=2 SSR SSR_STEPS=96 IBL LOCAL_EXPOSURE !MICRO_DETAIL WATER_CAUSTICS BLOOM
profile.HIGH = SHADOW_QUALITY=3 shadowMapResolution=4096 CLOUD_SHADOWS VOLUMETRIC_FOG VOLUME_QUALITY=3 SSR SSR_STEPS=128 IBL LOCAL_EXPOSURE !MICRO_DETAIL WATER_CAUSTICS BLOOM

screen.columns = 2
screen.SHADOWS = SHADOW_QUALITY shadowMapResolution CLOUD_SHADOWS TEXEL_SHADOWS SHADOW_SUN_STEP SHADOW_NORMAL_OFFSET SHADOW_BIAS_SCALE SSS_CONTRIBUTION SSS_FALLOFF DIFFUSE_WRAP
screen.VOLUME = VOLUMETRIC_FOG VOLUME_QUALITY VOLUME_TEMPORAL VOLUME_FAST_SHADOWS FOG_DENSITY_MUL
screen.MATERIALS = MICRO_DETAIL MICRO_DETAIL_STRENGTH PBR_FORMAT PBR_TABLE EMISSIVE_STRENGTH EMISSIVE_BLOOM GLINT_STRENGTH GLINT_GLOW
screen.LIGHTING = HAND_LIGHT BLOCK_LIGHT_INTENSITY SKY_LIGHT_CURVE SKY_INTENSITY SKY_AMBIENT_MUL
screen.REFLECTIONS = SSR SSR_STEPS IBL
screen.WATER = WATER_TEXTURE WATER_TEXTURE_OPACITY WATER_TEXTURE_NORMALS WATER_WAVES WATER_CAUSTICS
screen.POST = RENDER_SCALE TAA TAA_ANTI_FLICKER TAA_BLEND TAA_SHARPNESS BLOOM BLOOM_INTENSITY BLOOM_THRESHOLD AUTO_EXPOSURE EXPOSURE_EV LOCAL_EXPOSURE LOCAL_EXPOSURE_STRENGTH TONEMAP_OPERATOR TONEMAP_CONTRAST TONEMAP_HDR_MAX TONEMAP_MID_OUT TONEMAP_CROSSTALK GRADE_CONTRAST GRADE_SATURATION GRADE_GAMMA COLOR_TEMPERATURE_ON COLOR_TEMPERATURE BIOME_GRADING

sliders = SUN_HALO_STRENGTH EMISSIVE_BLOOM CLOUD_OPACITY WATER_TEXTURE_OPACITY TAA_BLEND TAA_SHARPNESS SHADOW_QUALITY shadowMapResolution SHADOW_NORMAL_OFFSET SHADOW_BIAS_SCALE SSS_CONTRIBUTION SSS_FALLOFF DIFFUSE_WRAP VOLUME_QUALITY FOG_DENSITY_MUL MICRO_DETAIL_STRENGTH EMISSIVE_STRENGTH BLOCK_LIGHT_INTENSITY SKY_LIGHT_CURVE SKY_INTENSITY SKY_AMBIENT_MUL SSR_STEPS CLOUD_DENSITY CLOUD_PHASE_G SUN_DISC_INTENSITY STAR_INTENSITY BLOOM_INTENSITY BLOOM_THRESHOLD EXPOSURE_EV LOCAL_EXPOSURE_STRENGTH TONEMAP_OPERATOR TONEMAP_CONTRAST TONEMAP_HDR_MAX TONEMAP_MID_OUT TONEMAP_CROSSTALK GRADE_CONTRAST GRADE_SATURATION GRADE_GAMMA COLOR_TEMPERATURE DEBUG_VIEW
program.world-1/shadow_solid.enabled = false

screen = <profile> <empty> [SHADOWS] [VOLUME] [MATERIALS] [LIGHTING] [REFLECTIONS] [SKY] [WATER] [POST] DEBUG_VIEW

screen.SKY = CLOUD_LIGHTING CLOUD_OPACITY CLOUD_DENSITY CLOUD_PHASE_G SUN_DISC_INTENSITY STAR_INTENSITY CLOUD_SOLAR_RIM CLOUD_RIM_STRENGTH CLOUD_RIM_STYLE SUN_LIGHT_BLEED SUN_GLOW_STRENGTH SUN_HALO_STRENGTH
