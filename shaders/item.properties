# Adding mods: confirm registry names with F3 (blocks), F3+H (items), or ItemStackExporter.
# Reuse an existing material class only after checking behavior/version; never guess registry names.
# Held items use MAT_HAND. Iris gives the id below in currentRenderedItemId while an item draws; only the ids the shaders
# read are listed (armour 110-116, light sources 120).

# armour (lib/surface.glsl armourMaterial): Iris gives the piece's id in currentRenderedItemId while its layer draws
item.110 = minecraft:chainmail_helmet minecraft:chainmail_chestplate minecraft:chainmail_leggings minecraft:chainmail_boots
item.111 = minecraft:iron_helmet minecraft:iron_chestplate minecraft:iron_leggings minecraft:iron_boots
item.112 = minecraft:golden_helmet minecraft:golden_chestplate minecraft:golden_leggings minecraft:golden_boots
item.113 = minecraft:diamond_helmet minecraft:diamond_chestplate minecraft:diamond_leggings minecraft:diamond_boots
item.114 = minecraft:netherite_helmet minecraft:netherite_chestplate minecraft:netherite_leggings minecraft:netherite_boots
item.115 = minecraft:turtle_helmet
item.116 = minecraft:copper_helmet minecraft:copper_chestplate minecraft:copper_leggings minecraft:copper_boots

# torches and lanterns as items: the flame glows (program/gbuffers_solid.glsl, ITEM_LIGHT_SOURCE)
item.120 = minecraft:torch minecraft:soul_torch minecraft:redstone_torch minecraft:copper_torch minecraft:lantern minecraft:soul_lantern minecraft:copper_lantern minecraft:exposed_copper_lantern minecraft:weathered_copper_lantern minecraft:oxidized_copper_lantern minecraft:waxed_copper_lantern minecraft:waxed_exposed_copper_lantern minecraft:waxed_weathered_copper_lantern minecraft:waxed_oxidized_copper_lantern
